name: Build

on:
  workflow_dispatch:
    inputs:
      package_name:
        description: "Package name of the game:"
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install required Android tools
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "cmake;3.22.1" \
            "ndk;25.1.8937393"

      - name: Build module
        env:
          PACKAGE_NAME: ${{ inputs.package_name }}
        run: |
          set -euo pipefail

          if [[ ! "$PACKAGE_NAME" =~ ^[A-Za-z][A-Za-z0-9_]*(\.[A-Za-z][A-Za-z0-9_]*)+$ ]]; then
            echo "Invalid Android package name: $PACKAGE_NAME"
            exit 1
          fi

          chmod +x ./gradlew

          sed -i \
            "s|moduleDescription = \"|moduleDescription = \"(${PACKAGE_NAME}) |g" \
            module.gradle

          sed -i \
            "s|com\.game\.packagename|${PACKAGE_NAME}|g" \
            module/src/main/cpp/game.h

          ./gradlew :module:assembleRelease --stacktrace

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: zygisk-il2cppdumper
          path: out/magisk_module_release/
          if-no-files-found: error
